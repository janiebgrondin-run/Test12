<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missive en français</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 48px 56px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      color: #111;
    }

    p {
      color: #555;
      margin: 0 0 32px;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1558b0;
    }

    .flag {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flag">🇫🇷</div>
    <h1>Missive en français</h1>
    <p>Cliquez pour ouvrir Missive traduit en français via Google Traduction.</p>
    <a
      class="btn"
      href="https://translate.google.com/translate?sl=en&tl=fr&u=https%3A%2F%2Fmissiveapp.com"
      target="_blank"
      rel="noopener noreferrer"
    >
      Ouvrir Missive en français
    </a>
  </div>
</body>
</html>
