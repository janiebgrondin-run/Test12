<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missive — Version française</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1a1a2e;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 2px solid #0f3460;
    }

    header span.flag { font-size: 1.4rem; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header p {
      font-size: 0.78rem;
      color: #aaa;
      margin-left: auto;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <span class="flag">🇫🇷</span>
    <h1>Missive — Traduit en français</h1>
    <p>Contenu traduit automatiquement via Google Traduction</p>
  </header>

  <iframe
    src="https://missiveapp-com.translate.goog/?_x_tr_sl=en&_x_tr_tl=fr&_x_tr_hl=fr&_x_tr_pto=wapp"
    title="Missive en français"
    allowfullscreen
  ></iframe>
</body>
</html>
