name: ✈️ Gabrielle · Vol TS1691 Tracker

on:
  schedule:
    - cron: '0,45 * * * *'  # every ~45 minutes
  workflow_dispatch:         # run manually anytime from phone
    inputs:
      test:
        description: 'Send test SMS instead of flight check'
        required: false
        default: 'false'

permissions:
  contents: write            # needed to commit flight-data.json back

jobs:
  check-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Check TS1691 & send SMS
        env:
          FLIGHT_NUMBER:       TS1691
          ALERT_PHONE:         +14182627032
          AVIATION_API_KEY:    ${{ secrets.AVIATION_API_KEY }}
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          WHATSAPP_ENABLED:    ${{ secrets.WHATSAPP_ENABLED }}
          TEST_MODE:           ${{ github.event.inputs.test }}
        run: |
          if [ "$TEST_MODE" = "true" ]; then
            node -e "require('./server.js').sendTestSMSAlert().then(r => { console.log(JSON.stringify(r)); process.exit(r.sent ? 0 : 1); })"
          else
            node -e "require('./server.js').checkFlight().then(() => process.exit(0))"
          fi

      - name: Save flight data to repo
        if: ${{ github.event.inputs.test != 'true' }}
        run: |
          git config user.name  "Flight Tracker Bot"
          git config user.email "flight-tracker@github-actions"
          git add flight-data.json alerts.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "✈️ Update flight data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
