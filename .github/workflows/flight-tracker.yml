name: ✈️ Gabrielle · Vol TS691 Tracker

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, 24/7
  workflow_dispatch:         # run manually anytime from phone

jobs:
  check-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - name: Check TS691 & send SMS
        env:
          FLIGHT_NUMBER:       TS691
          ALERT_PHONE:         +14182627032
          AVIATION_API_KEY:    ${{ secrets.AVIATION_API_KEY }}
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          WHATSAPP_ENABLED:    ${{ secrets.WHATSAPP_ENABLED }}
        run: node -e "require('./server.js').checkFlight().then(() => process.exit(0))"
