<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sip — Drink Tracker</title>
<style>
:root {
  --text: #37352f;
  --text-2: #6b6b6b;
  --text-3: #9b9a97;
  --bg: #ffffff;
  --bg-2: #f7f6f3;
  --bg-3: #efeeec;
  --border: #e9e9e7;
  --accent: #2383e2;
  --accent-bg: #e7f0fb;
  --green: #0f7b6c;
  --green-bg: #e6f4f1;
  --font: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --r: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }

/* ── Header ── */
.header {
  position:sticky; top:0;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:0 24px; z-index:100;
}
.header-inner {
  max-width:740px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  height:54px;
}
.logo { font-size:15px; font-weight:700; display:flex; align-items:center; gap:7px; letter-spacing:-.2px; }
.logo-icon { font-size:20px; }

/* ── Tabs ── */
.tabs { display:flex; gap:2px; background:var(--bg-2); border-radius:var(--r); padding:3px; }
.tab {
  padding:5px 16px; border-radius:6px; border:none;
  background:none; cursor:pointer; font-size:13px;
  font-family:var(--font); color:var(--text-2);
  transition:all .15s; font-weight:500;
}
.tab.active {
  background:white; color:var(--text); font-weight:600;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

/* ── Main ── */
.main { max-width:740px; margin:0 auto; padding:32px 24px 64px; }

.page-title { font-size:26px; font-weight:700; letter-spacing:-.4px; }
.page-sub { font-size:13px; color:var(--text-3); margin-top:3px; margin-bottom:28px; }

/* ── Add card ── */
.add-card { background:var(--bg-2); border-radius:10px; padding:20px 20px 18px; margin-bottom:24px; }
.card-label {
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.07em; color:var(--text-3); margin-bottom:14px;
}
.add-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.fg { display:flex; flex-direction:column; gap:5px; }
.fl { font-size:12px; font-weight:500; color:var(--text-2); }
input, select {
  height:36px; border:1px solid var(--border); border-radius:6px;
  padding:0 11px; font-size:13px; font-family:var(--font);
  background:white; color:var(--text); outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus, select:focus {
  border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg);
}
select { cursor:pointer; }
#drink-select { min-width:185px; }
#drink-custom { display:none; width:185px; }
#drink-amount { width:72px; }
#drink-unit { width:95px; }
.btn-log {
  height:36px; padding:0 16px;
  background:var(--text); color:white; border:none; border-radius:6px;
  font-size:13px; font-weight:600; font-family:var(--font);
  cursor:pointer; transition:opacity .15s; white-space:nowrap; align-self:flex-end;
}
.btn-log:hover { opacity:.82; }
.btn-log.ok { background:var(--green); }

/* ── Stats ── */
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
.stat { background:var(--bg-2); border-radius:10px; padding:14px 16px; }
.stat-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin-bottom:5px; }
.stat-val { font-size:22px; font-weight:800; letter-spacing:-.5px; }
.stat-sub { font-size:11px; color:var(--text-3); margin-top:2px; }

/* ── Section heading ── */
.sec { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-3); margin-bottom:10px; }

/* ── Log entries ── */
.log-list { display:flex; flex-direction:column; gap:1px; }
.log-item {
  display:flex; align-items:center; padding:10px 12px;
  border-radius:var(--r); transition:background .1s;
}
.log-item:hover { background:var(--bg-2); }
.log-emoji { font-size:19px; width:30px; text-align:center; margin-right:11px; flex-shrink:0; }
.log-info { flex:1; min-width:0; }
.log-drink { font-size:14px; font-weight:500; }
.log-meta { font-size:12px; color:var(--text-3); margin-top:1px; }
.log-time { font-size:12px; color:var(--text-3); margin-right:8px; white-space:nowrap; }
.btn-del {
  opacity:0; background:none; border:none; cursor:pointer;
  font-size:13px; color:var(--text-3); padding:4px 6px;
  border-radius:4px; transition:all .1s; line-height:1;
}
.log-item:hover .btn-del { opacity:1; }
.btn-del:hover { background:#fde8e8; color:#d44; }

/* ── Empty ── */
.empty { text-align:center; padding:44px 20px; color:var(--text-3); }
.empty-icon { font-size:38px; margin-bottom:10px; }
.empty-text { font-size:14px; }

/* ── Accordion ── */
.acc-list { display:flex; flex-direction:column; gap:8px; }
.acc {
  border:1px solid var(--border); border-radius:10px; overflow:hidden;
  transition:border-color .15s;
}
.acc:hover { border-color:var(--text-3); }
.acc-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px; cursor:pointer; user-select:none;
}
.acc-head:hover { background:var(--bg-2); }
.acc-name { font-size:14px; font-weight:500; }
.acc-right { display:flex; align-items:center; gap:14px; }
.acc-cnt { font-size:13px; color:var(--text-2); }
.acc-chev { font-size:13px; color:var(--text-3); transition:transform .2s; display:inline-block; }
.acc.open .acc-chev { transform:rotate(90deg); }
.acc-body { display:none; border-top:1px solid var(--border); padding:14px 16px; }
.acc.open .acc-body { display:block; }

/* ── Bar chart ── */
.bar-wrap { display:flex; flex-direction:column; gap:9px; }
.bar-row { display:flex; align-items:center; gap:10px; }
.bar-lbl { font-size:12px; color:var(--text-2); width:110px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track { flex:1; background:var(--bg-3); border-radius:4px; height:7px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; background:var(--text); transition:width .5s ease; }
.bar-n { font-size:11px; color:var(--text-3); width:22px; text-align:right; flex-shrink:0; }

/* ── Chips ── */
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip {
  display:flex; align-items:center; gap:5px;
  background:var(--bg-2); border-radius:20px;
  padding:3px 10px 4px; font-size:12px; color:var(--text-2);
}
.chip strong { color:var(--text); }

/* ── Divider ── */
.div { height:1px; background:var(--border); margin:18px 0; }

/* ── View ── */
.view { display:none; }
.view.active { display:block; }

/* ── Responsive ── */
@media(max-width:580px) {
  .add-row { flex-direction:column; }
  #drink-select, #drink-custom, #drink-amount, #drink-unit { width:100% !important; }
  .fg { width:100%; }
  .btn-log { width:100%; }
  .stats { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo"><span class="logo-icon">💧</span> Sip</div>
    <nav class="tabs">
      <button class="tab active" data-tab="today">Today</button>
      <button class="tab" data-tab="week">Week</button>
      <button class="tab" data-tab="month">Month</button>
    </nav>
  </div>
</header>

<main class="main">

  <!-- TODAY -->
  <div id="view-today" class="view active">
    <div class="page-title" id="t-title"></div>
    <div class="page-sub">Track every drink, one at a time</div>

    <div class="add-card">
      <div class="card-label">Log a drink</div>
      <div class="add-row">
        <div class="fg">
          <label class="fl">Drink</label>
          <select id="drink-select"></select>
          <input id="drink-custom" type="text" placeholder="Enter drink name…">
        </div>
        <div class="fg">
          <label class="fl">Amount</label>
          <input id="drink-amount" type="number" value="1" min="0.5" step="0.5">
        </div>
        <div class="fg">
          <label class="fl">Unit</label>
          <select id="drink-unit">
            <option>glass</option><option>cup</option><option>mug</option>
            <option>bottle</option><option>can</option><option>shot</option>
            <option>oz</option><option>ml</option><option>L</option>
          </select>
        </div>
        <button class="btn-log" id="btn-log">+ Log</button>
      </div>
    </div>

    <div class="stats" id="t-stats"></div>
    <div class="sec">Today's log</div>
    <div class="log-list" id="t-log"></div>
  </div>

  <!-- WEEK -->
  <div id="view-week" class="view">
    <div class="page-title" id="w-title">This Week</div>
    <div class="page-sub" id="w-sub"></div>
    <div class="stats" id="w-stats"></div>
    <div class="sec">Drinks per day</div>
    <div class="add-card" style="margin-bottom:24px">
      <div class="bar-wrap" id="w-bars"></div>
    </div>
    <div class="sec">Daily breakdown</div>
    <div class="acc-list" id="w-list"></div>
  </div>

  <!-- MONTH -->
  <div id="view-month" class="view">
    <div class="page-title" id="m-title"></div>
    <div class="page-sub" id="m-sub"></div>
    <div class="stats" id="m-stats"></div>
    <div class="sec">Top drinks this month</div>
    <div class="add-card" style="margin-bottom:24px">
      <div class="bar-wrap" id="m-bars"></div>
    </div>
    <div class="sec">Weekly breakdown</div>
    <div class="acc-list" id="m-list"></div>
  </div>

</main>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const DEFAULTS = [
  {name:'Water',       emoji:'💧'},
  {name:'Coffee',      emoji:'☕'},
  {name:'Tea',         emoji:'🍵'},
  {name:'Beer',        emoji:'🍺'},
  {name:'Wine',        emoji:'🍷'},
  {name:'Cocktail',    emoji:'🍸'},
  {name:'Juice',       emoji:'🧃'},
  {name:'Soda',        emoji:'🥤'},
  {name:'Whiskey',     emoji:'🥃'},
  {name:'Kombucha',    emoji:'🫙'},
  {name:'Milk',        emoji:'🥛'},
  {name:'Smoothie',    emoji:'🫐'},
  {name:'Energy Drink',emoji:'⚡'},
  {name:'Sparkling Water',emoji:'💦'},
  {name:'Hot Chocolate',emoji:'🍫'},
  {name:'Lemonade',    emoji:'🍋'},
];

// ── Storage ──────────────────────────────────────────────────────────────────
const load = () => { try { return JSON.parse(localStorage.getItem('sip_v1')||'[]'); } catch { return []; } };
const save = l => localStorage.setItem('sip_v1', JSON.stringify(l));

// ── Helpers ──────────────────────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().split('T')[0];
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);

function fmtDate(s, opts) {
  return new Date(s+'T12:00:00').toLocaleDateString('en-US', opts||{weekday:'long',month:'long',day:'numeric'});
}
function fmtShort(s) {
  return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function weekOf(s) {
  const d = new Date(s+'T12:00:00');
  const start = new Date(d); start.setDate(d.getDate()-d.getDay());
  return Array.from({length:7},(_,i)=>{ const dd=new Date(start); dd.setDate(start.getDate()+i); return dd.toISOString().split('T')[0]; });
}
function monthWeeks(s) {
  const d = new Date(s+'T12:00:00');
  const y=d.getFullYear(), m=d.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const weeks=[]; let cur=new Date(first); cur.setDate(cur.getDate()-cur.getDay());
  while(cur<=last){
    weeks.push(Array.from({length:7},(_,i)=>{ const dd=new Date(cur); dd.setDate(cur.getDate()+i); return dd.toISOString().split('T')[0]; }));
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

function countsByDrink(logs) {
  const m={};
  logs.forEach(l=>{ if(!m[l.drink]) m[l.drink]={emoji:l.emoji,count:0}; m[l.drink].count++; });
  return Object.entries(m).sort((a,b)=>b[1].count-a[1].count);
}

function topDropdown(logs) {
  const freq = countsByDrink(logs).map(([name,d])=>({name,emoji:d.emoji}));
  const names = new Set(freq.map(d=>d.name));
  const result = [...freq.slice(0,6)];
  for(const d of DEFAULTS){ if(result.length>=6) break; if(!names.has(d.name)) result.push(d); }
  return result;
}

// ── Dropdown ─────────────────────────────────────────────────────────────────
function refreshDropdown() {
  const sel = document.getElementById('drink-select');
  const prev = sel.value;
  const drinks = topDropdown(load());
  sel.innerHTML = drinks.map(d=>`<option value="${d.name}" data-emoji="${d.emoji}">${d.emoji} ${d.name}</option>`).join('')
    + `<option value="__other__">✏️ Other…</option>`;
  if(prev && [...sel.options].some(o=>o.value===prev)) sel.value=prev;
}

document.getElementById('drink-select').addEventListener('change', function(){
  const custom = document.getElementById('drink-custom');
  if(this.value==='__other__'){ custom.style.display='block'; custom.focus(); }
  else custom.style.display='none';
});

// ── Stat card ────────────────────────────────────────────────────────────────
const statCard = (lbl,val,sub) =>
  `<div class="stat"><div class="stat-lbl">${lbl}</div><div class="stat-val">${val}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div>`;

// ── Bar chart ────────────────────────────────────────────────────────────────
function barChart(rows) {
  if(!rows.length) return '<div style="color:var(--text-3);font-size:13px">No data yet</div>';
  const mx = Math.max(...rows.map(r=>r.n),1);
  return rows.map(r=>`
    <div class="bar-row">
      <div class="bar-lbl">${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.n/mx*100)}%"></div></div>
      <div class="bar-n">${r.n}</div>
    </div>`).join('');
}

// ── Chips ────────────────────────────────────────────────────────────────────
function chips(logs) {
  return countsByDrink(logs).map(([name,d])=>
    `<div class="chip">${d.emoji} ${name} <strong>×${d.count}</strong></div>`).join('');
}

// ── Accordion item ───────────────────────────────────────────────────────────
function accItem(label, logs, open) {
  const c = logs.length;
  const el = document.createElement('div');
  el.className='acc'+(open?' open':'');
  el.innerHTML=`
    <div class="acc-head">
      <span class="acc-name">${label}</span>
      <div class="acc-right">
        <span class="acc-cnt">${c} drink${c!==1?'s':''}</span>
        <span class="acc-chev">›</span>
      </div>
    </div>
    <div class="acc-body">
      ${c?`<div class="chips">${chips(logs)}</div>`
          :'<div style="color:var(--text-3);font-size:13px">No drinks logged</div>'}
    </div>`;
  el.querySelector('.acc-head').addEventListener('click', ()=>el.classList.toggle('open'));
  return el;
}

// ── Today ────────────────────────────────────────────────────────────────────
function renderToday() {
  const t = todayStr();
  const all = load();
  const logs = all.filter(l=>l.date===t);

  document.getElementById('t-title').textContent = fmtDate(t);

  const total = logs.reduce((s,l)=>s+l.amount,0);
  const types = new Set(logs.map(l=>l.drink)).size;
  document.getElementById('t-stats').innerHTML =
    statCard('Drinks',logs.length,'entries today')
    +statCard('Total',total,'units logged')
    +statCard('Types',types,'different drinks');

  const el = document.getElementById('t-log');
  if(!logs.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🫗</div><div class="empty-text">Nothing logged yet. Add your first drink above.</div></div>`;
    return;
  }
  el.innerHTML='';
  [...logs].reverse().forEach(log=>{
    const item=document.createElement('div');
    item.className='log-item';
    item.innerHTML=`
      <div class="log-emoji">${log.emoji}</div>
      <div class="log-info">
        <div class="log-drink">${log.drink}</div>
        <div class="log-meta">${log.amount} ${log.unit}</div>
      </div>
      <div class="log-time">${log.time}</div>
      <button class="btn-del" data-id="${log.id}" title="Remove">✕</button>`;
    item.querySelector('.btn-del').addEventListener('click', e=>{
      e.stopPropagation();
      save(load().filter(l=>l.id!==log.id));
      refreshDropdown(); renderToday();
    });
    el.appendChild(item);
  });
}

// ── Week ─────────────────────────────────────────────────────────────────────
function renderWeek() {
  const t = todayStr();
  const wdates = weekOf(t);
  const all = load();
  const wlogs = all.filter(l=>wdates.includes(l.date));

  const d0=new Date(wdates[0]+'T12:00:00'), d6=new Date(wdates[6]+'T12:00:00');
  document.getElementById('w-sub').textContent =
    `${d0.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${d6.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  const total=wlogs.reduce((s,l)=>s+l.amount,0);
  const avg=(wlogs.length/7).toFixed(1);
  document.getElementById('w-stats').innerHTML =
    statCard('This Week',wlogs.length,'total drinks')
    +statCard('Daily Avg',avg,'drinks / day')
    +statCard('Units',total,'consumed');

  document.getElementById('w-bars').innerHTML = barChart(
    wdates.map(d=>({
      label: new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}),
      n: all.filter(l=>l.date===d).length
    }))
  );

  const listEl=document.getElementById('w-list'); listEl.innerHTML='';
  wdates.slice().reverse().forEach(d=>{
    listEl.appendChild(accItem(
      fmtShort(d)+(d===t?' · Today':''),
      all.filter(l=>l.date===d),
      d===t
    ));
  });
}

// ── Month ────────────────────────────────────────────────────────────────────
function renderMonth() {
  const t = todayStr();
  const d = new Date(t+'T12:00:00');
  const y=d.getFullYear(), mo=d.getMonth();
  const first=new Date(y,mo,1).toISOString().split('T')[0];
  const last=new Date(y,mo+1,0).toISOString().split('T')[0];
  const all=load();
  const mlogs=all.filter(l=>l.date>=first&&l.date<=last);

  document.getElementById('m-title').textContent=d.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('m-sub').textContent=`${new Date(y,mo+1,0).getDate()} days`;

  const activeDays=new Set(mlogs.map(l=>l.date)).size;
  const total=mlogs.reduce((s,l)=>s+l.amount,0);
  document.getElementById('m-stats').innerHTML =
    statCard('This Month',mlogs.length,'total drinks')
    +statCard('Active Days',activeDays,'days with drinks')
    +statCard('Units',total,'consumed');

  const topDrinks=countsByDrink(mlogs).slice(0,8).map(([name,d])=>({label:`${d.emoji} ${name}`,n:d.count}));
  document.getElementById('m-bars').innerHTML = topDrinks.length
    ? barChart(topDrinks)
    : '<div style="color:var(--text-3);font-size:13px">No data yet</div>';

  const listEl=document.getElementById('m-list'); listEl.innerHTML='';
  const wdates=weekOf(t);
  monthWeeks(t).forEach((week,i)=>{
    const wlogs=all.filter(l=>week.includes(l.date));
    const wfirst=week.find(d=>d>=first)||week[0];
    const wlast=[...week].reverse().find(d=>d<=last)||week[6];
    const s=new Date(wfirst+'T12:00:00'), e=new Date(wlast+'T12:00:00');
    const isCurrentWk=wdates.some(d=>week.includes(d));
    listEl.appendChild(accItem(
      `Week ${i+1} · ${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})}–${e.toLocaleDateString('en-US',{day:'numeric'})}`,
      wlogs,
      isCurrentWk
    ));
  });
}

// ── Tab navigation ───────────────────────────────────────────────────────────
const renders = {today:renderToday, week:renderWeek, month:renderMonth};
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    renders[btn.dataset.tab]();
  });
});

// ── Log button ───────────────────────────────────────────────────────────────
document.getElementById('btn-log').addEventListener('click', ()=>{
  const sel=document.getElementById('drink-select');
  const custom=document.getElementById('drink-custom');
  const amount=parseFloat(document.getElementById('drink-amount').value)||1;
  const unit=document.getElementById('drink-unit').value;

  let name, emoji;
  if(sel.value==='__other__'){
    name=(custom.value||'').trim();
    if(!name){ custom.focus(); return; }
    const match=DEFAULTS.find(d=>d.name.toLowerCase()===name.toLowerCase());
    emoji=match?match.emoji:'🥤';
  } else {
    name=sel.value;
    emoji=sel.options[sel.selectedIndex]?.dataset?.emoji||'🥤';
  }

  const now=new Date();
  const log={
    id:uid(), date:todayStr(), drink:name, emoji,
    amount, unit,
    time:now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})
  };
  save([...load(),log]);
  custom.value=''; custom.style.display='none';
  refreshDropdown(); renderToday();

  const btn=document.getElementById('btn-log');
  btn.textContent='✓ Logged!'; btn.classList.add('ok');
  setTimeout(()=>{ btn.textContent='+ Log'; btn.classList.remove('ok'); },1100);
});

// ── Init ─────────────────────────────────────────────────────────────────────
refreshDropdown();
renderToday();
</script>
</body>
</html>
