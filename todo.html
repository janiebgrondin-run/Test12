<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .add-row input {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }

    .add-row input:focus { border-color: #6366f1; }

    .add-row button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }

    .add-row button:hover { background: #4f46e5; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filters button {
      background: none;
      border: 1.5px solid #e5e7eb;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #6b7280;
      transition: all .15s;
    }

    .filters button.active,
    .filters button:hover {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      animation: slide-in .2s ease;
    }

    li:last-child { border-bottom: none; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #374151;
      word-break: break-word;
      transition: color .2s;
    }

    li.done .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #d1d5db;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color .15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .summary {
      margin-top: 20px;
      font-size: 0.82rem;
      color: #9ca3af;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>To-Do List</h1>

    <div class="add-row">
      <input id="new-task" type="text" placeholder="Add a new task…" autocomplete="off" />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all"    onclick="setFilter('all',    this)">All</button>
      <button               data-filter="active"  onclick="setFilter('active',  this)">Active</button>
      <button               data-filter="done"    onclick="setFilter('done',    this)">Done</button>
    </div>

    <ul id="task-list"></ul>
    <p  id="empty"     class="empty" style="display:none">No tasks here.</p>
    <p  id="summary"   class="summary"></p>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById('task-list');
      const empty = document.getElementById('empty');
      const summary = document.getElementById('summary');

      const visible = tasks.filter(t =>
        filter === 'all'    ? true :
        filter === 'active' ? !t.done :
                               t.done
      );

      list.innerHTML = '';
      visible.forEach(task => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''}
                 onchange="toggle('${task.id}')" />
          <span class="task-text">${escHtml(task.text)}</span>
          <button class="delete-btn" onclick="remove('${task.id}')" title="Delete">&#10005;</button>
        `;
        list.appendChild(li);
      });

      empty.style.display = visible.length === 0 ? 'block' : 'none';

      const done  = tasks.filter(t => t.done).length;
      const total = tasks.length;
      summary.textContent = total ? `${done} / ${total} completed` : '';
    }

    function addTask() {
      const input = document.getElementById('new-task');
      const text  = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      const task = tasks.find(t => t.id === id);
      if (task) { task.done = !task.done; save(); render(); }
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('new-task').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
